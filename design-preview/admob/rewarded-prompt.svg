    <text x="20" y="420" font-size="12" font-weight="800" letter-spacing="1" fill="#D4EDD4" fill-opacity="0.58">FREE VARIANTS (PLUS · UNDER 13 · UNKNOWN AGE)</text>
    <rect x="20" y="432" width="370" height="62" rx="16" fill="none" stroke="#D4EDD4" stroke-opacity="0.14"/>
    <path d="M47 470 c-10 -2 -12 -14 -2 -24 c10 10 8 22 2 24z" fill="#66BB6A"/>
