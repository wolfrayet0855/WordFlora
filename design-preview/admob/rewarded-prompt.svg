    <rect x="20" y="504" width="370" height="62" rx="16" fill="none" stroke="#D4EDD4" stroke-opacity="0.14"/>
    <path d="M47 542 c-10 -2 -12 -14 -2 -24 c10 10 8 22 2 24z" fill="#66BB6A"/>
    <text x="70" y="530" font-size="15" font-weight="600" fill="#D4EDD4">Ask the garden for a hint</text>
    <text x="70" y="550" font-size="13" fill="#D4EDD4" fill-opacity="0.6">A whisper for your next word</text>
    <rect x="20" y="576" width="370" height="62" rx="16" fill="none" stroke="#D4EDD4" stroke-opacity="0.14"/>
    <circle cx="47" cy="607" r="9" fill="#F0C060"/>
    <text x="70" y="602" font-size="15" font-weight="600" fill="#D4EDD4">Wake gently</text>
    <text x="70" y="622" font-size="13" fill="#D4EDD4" fill-opacity="0.6">Once a day, after one try</text>
