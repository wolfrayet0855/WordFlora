<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" font-family="ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif">
  <title>WordFlora native ad card in the Garden Shed, light and dark</title>
  <desc>Shed bottom section. Sponsored section label, then a card that does not use the plant-card style: flat muted fill, 1 pt border, no leaf art. Ad badge top left (at least 20 pt tall, over the 15 px minimum), AdChoices top right (drawn by the SDK), advertiser icon and headline, media view 16:9 at least 120 pt tall, body, outlined call-to-action button. Only the asset views are tappable; the card background is not.</desc>
  <!-- LIGHT -->
  <g>
    <rect x="0" y="0" width="410" height="640" fill="#FAF7F0"/>
    <text x="20" y="34" font-size="13" font-weight="800" letter-spacing="1.2" fill="#2C3E2C" fill-opacity="0.58">POTS</text>
    <rect x="20" y="46" width="176" height="64" rx="14" fill="#FFFFFF" stroke="#2C3E2C" stroke-opacity="0.12"/>
    <rect x="214" y="46" width="176" height="64" rx="14" fill="#FFFFFF" stroke="#2C3E2C" stroke-opacity="0.12"/>
    <text x="20" y="146" font-size="13" font-weight="800" letter-spacing="1.2" fill="#2C3E2C" fill-opacity="0.58">SPONSORED</text>
    <text x="20" y="166" font-size="13" fill="#2C3E2C" fill-opacity="0.58">Ads help keep WordFlora free.</text>
    <!-- card -->
    <rect x="20" y="180" width="370" height="440" rx="12" fill="#F1EEE6" stroke="#2C3E2C" stroke-opacity="0.22"/>
    <!-- Ad badge -->
    <rect x="34" y="194" width="34" height="22" rx="5" fill="#2C3E2C"/>
    <text x="51" y="210" font-size="13" font-weight="800" fill="#FAF7F0" text-anchor="middle">Ad</text>
    <text x="76" y="210" font-size="13" fill="#2C3E2C" fill-opacity="0.7">Advertiser name</text>
    <!-- AdChoices (SDK) -->
    <rect x="356" y="190" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#7a7a7a" stroke-width="0.8"/>
    <path d="M362 194 l6 5 -6 5z" fill="#00aecd"/>
    <text x="378" y="203" font-size="7" fill="#555" text-anchor="middle">i</text>
    <!-- icon + headline -->
    <rect x="34" y="228" width="40" height="40" rx="9" fill="#CBD5E1"/>
    <text x="86" y="244" font-size="16" font-weight="700" fill="#2C3E2C">Headline wraps in full, never</text>
    <text x="86" y="264" font-size="16" font-weight="700" fill="#2C3E2C">cut below 25 characters</text>
    <!-- media -->
    <rect x="34" y="280" width="342" height="192" rx="6" fill="#D9D4C7"/>
    <text x="205" y="380" font-size="13" fill="#2C3E2C" fill-opacity="0.6" text-anchor="middle">MediaView 16:9, min 120 pt tall</text>
    <!-- body -->
    <text x="34" y="498" font-size="14" fill="#2C3E2C" fill-opacity="0.8">Body text wraps in full (never truncated below</text>
    <text x="34" y="516" font-size="14" fill="#2C3E2C" fill-opacity="0.8">90 characters). No line limit at any text size.</text>
    <!-- CTA outlined -->
    <rect x="34" y="540" width="342" height="48" rx="12" fill="none" stroke="#2C3E2C" stroke-width="1.5"/>
    <text x="205" y="570" font-size="16" font-weight="700" fill="#2C3E2C" text-anchor="middle">Install</text>
    <text x="205" y="608" font-size="11" fill="#2C3E2C" fill-opacity="0.55" text-anchor="middle">Card background is not tappable</text>
  </g>
  <!-- DARK -->
  <g transform="translate(410,0)">
    <rect x="0" y="0" width="410" height="640" fill="#1A2E1A"/>
    <text x="20" y="34" font-size="13" font-weight="800" letter-spacing="1.2" fill="#D4EDD4" fill-opacity="0.58">POTS</text>
    <rect x="20" y="46" width="176" height="64" rx="14" fill="#2C3E2C" stroke="#D4EDD4" stroke-opacity="0.14"/>
    <rect x="214" y="46" width="176" height="64" rx="14" fill="#2C3E2C" stroke="#D4EDD4" stroke-opacity="0.14"/>
    <text x="20" y="146" font-size="13" font-weight="800" letter-spacing="1.2" fill="#D4EDD4" fill-opacity="0.58">SPONSORED</text>
    <text x="20" y="166" font-size="13" fill="#D4EDD4" fill-opacity="0.58">Ads help keep WordFlora free.</text>
    <rect x="20" y="180" width="370" height="440" rx="12" fill="#22362A" stroke="#D4EDD4" stroke-opacity="0.26"/>
    <rect x="34" y="194" width="34" height="22" rx="5" fill="#D4EDD4"/>
    <text x="51" y="210" font-size="13" font-weight="800" fill="#1A2E1A" text-anchor="middle">Ad</text>
    <text x="76" y="210" font-size="13" fill="#D4EDD4" fill-opacity="0.7">Advertiser name</text>
    <rect x="356" y="190" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#7a7a7a" stroke-width="0.8"/>
    <path d="M362 194 l6 5 -6 5z" fill="#00aecd"/>
    <text x="378" y="203" font-size="7" fill="#555" text-anchor="middle">i</text>
    <rect x="34" y="228" width="40" height="40" rx="9" fill="#475569"/>
    <text x="86" y="244" font-size="16" font-weight="700" fill="#D4EDD4">Headline wraps in full, never</text>
    <text x="86" y="264" font-size="16" font-weight="700" fill="#D4EDD4">cut below 25 characters</text>
    <rect x="34" y="280" width="342" height="192" rx="6" fill="#33463A"/>
    <text x="205" y="380" font-size="13" fill="#D4EDD4" fill-opacity="0.6" text-anchor="middle">MediaView 16:9, min 120 pt tall</text>
    <text x="34" y="498" font-size="14" fill="#D4EDD4" fill-opacity="0.8">Body text wraps in full (never truncated below</text>
    <text x="34" y="516" font-size="14" fill="#D4EDD4" fill-opacity="0.8">90 characters). No line limit at any text size.</text>
    <rect x="34" y="540" width="342" height="48" rx="12" fill="none" stroke="#D4EDD4" stroke-width="1.5"/>
    <text x="205" y="570" font-size="16" font-weight="700" fill="#D4EDD4" text-anchor="middle">Install</text>
    <text x="205" y="608" font-size="11" fill="#D4EDD4" fill-opacity="0.55" text-anchor="middle">Card background is not tappable</text>
  </g>
</svg>
