<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share card</title><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="screen.css"><script src="../theme.js"></script></head>
<body class="stage"><div style="text-align:center"><div style="width:300px;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);background:linear-gradient(160deg,#FDF1D0,#F8D9A0 55%,#EFB86A);color:#2C3E2C;text-align:center;padding:26px 22px 20px;position:relative">
<div style="font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.7">New plant collected</div>
