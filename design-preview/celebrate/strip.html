<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame Strip</title>
<style>
  body { margin: 0; background: #8a8a84; font: 600 15px ui-rounded, system-ui, sans-serif; color: #fff; }
  .row { display: flex; gap: 12px; padding: 8px 12px 12px; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .cell span { height: 20px; }
  iframe { width: 393px; height: 852px; border: 0; display: block; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  // strip.html?src=intro.html&q=theme=dark%26rm=1&times=0,0.6,1.2,2.0,3.0
  const q = new URLSearchParams(location.search);
  const src = q.get('src'), extra = q.get('q') || '', times = (q.get('times') || '0,0.6,1.2,2.0,3.0').split(',');
  const row = document.getElementById('row');
  for (const t of times) {
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.innerHTML = `<span>${src.replace('.html', '')} ${extra.replace(/&/g, ' ')}  t = ${t} s</span>`;
    const f = document.createElement('iframe'); f.src = `${src}?t=${t}&${extra}`;
    cell.appendChild(f); row.appendChild(cell);
  }
</script>
</body>
</html>
