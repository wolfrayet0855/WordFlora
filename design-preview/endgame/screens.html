<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endgame and weather</title>
<!--
  Revision 1. One phone (393 x 852) per URL. Params:
    s=a        Grand Garden (allFound): panorama, plants at their EARNED stage, Gardener's Crown
    s=gold     Gold crown (allFullBloom): smaller moment, every plant full bloom, crown petals gold
    s=home     Follow-up beat on Home: the crown sits on the wordmark (from old B)
    s=share    Share sheet over A: garden postcard (from old C).  kid=1 -> under 13, grown-up check
    s=next     What grows next: Golden blooms, Bloom ranks, Visitors' book, Garden weather
    s=intro    Weather puzzle card before play (Start / Skip same size, "A harder one" chip)
    s=puzzle   Weather puzzle, harder tier: two-word answer in two slot groups, decoy tile, no given letters
    s=part2    Wild Weather part 2 of 2: short butterfly catch, "Try a word instead"
    s=cap      Daily cap reached
    s=mended   Solved: sticker, +1 word, Weathered badge step
    s=settings Garden weather (on), forecast notice (off), Wild Weather (13 and up, off)
    theme=light|dark  rm=1 (Reduce Motion still)  scale=1|1.3  tall=1  static=1 (freeze for PNG)
  Old screens (revision 0) live in screens-v1.html.
-->
<style>
:root,[data-theme=light]{
  --bg:#FAF7F0;--surface:#FFFFFF;--text:#2C3E2C;--accent:#E8A838;--ink:#1F3320;--accent-text:#8A5A00;--ok:#2E7D32;
  --sec:color-mix(in srgb,var(--text) 88%,transparent);--line:color-mix(in srgb,var(--text) 12%,transparent);
  --visit:#ECE5F6;--bloom:#FDE9EE;--levels:#DFEDF8;--garden:#E3F1DD;--visit-ink:#6A4A9C;--levels-ink:#1F5F8F;--bloom-ink:#A33A55;
  --shadow:0 10px 30px rgba(44,62,44,.16);--soft:0 2px 8px rgba(44,62,44,.10);
  --h1:#DCEBD2;--h2:#CDE3C0;--h3:#BFDAAF;--h4:#B0D19E;--h5:#A2C78E;
  --petal:#F2A0B0;--gold:#E8A838;--tile:#FFFFFF;--slot:#F1ECE0;--wind:#D7E3EC;--toggle-off:#E3DED2;
  --dawn1:#DFEDF8;--dawn2:#F6E6E4;--dim:rgba(0,0,0,.42)}
[data-theme=dark]{
  --bg:#1A2E1A;--surface:#2C3E2C;--text:#D4EDD4;--accent:#F0C060;--ink:#1A2E1A;--accent-text:#F0C060;--ok:#81C784;
  --visit:#40395A;--bloom:#4D3039;--levels:#2A4358;--garden:#2F4F30;--visit-ink:#CDB8F2;--levels-ink:#8CC4EC;--bloom-ink:#F4A9BC;
  --shadow:0 10px 30px rgba(0,0,0,.45);--soft:0 2px 8px rgba(0,0,0,.35);
  --h1:#263F27;--h2:#2B482D;--h3:#305133;--h4:#355A38;--h5:#3A633E;
  --petal:#E98DA0;--gold:#F0C060;--tile:#34493A;--slot:#223822;--wind:#3A5266;--toggle-off:#4A6150;
  --dawn1:#3A5873;--dawn2:#5A4A5E;--dim:rgba(0,0,0,.55)}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--scale,1))}
body{margin:0;background:#888;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text)}
.phone{width:393px;height:852px;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.tall .phone{height:auto;min-height:max(852px,100vh)}
.status{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font:600 15px system-ui;position:relative;z-index:5}
h1{font-size:1.75rem;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.01em;text-align:center;text-wrap:balance}
p.body{font-size:1.0625rem;line-height:1.35;margin:0;text-align:center;color:var(--sec);text-wrap:balance}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;font-family:inherit;cursor:pointer;text-align:center;padding:10px 16px;color:var(--text)}
.btn svg{width:1.25rem;height:1.25rem;flex:none}
.btn.primary{min-height:56px;border-radius:18px;background:var(--accent);color:var(--ink);font-size:1.25rem;font-weight:800}
.btn.secondary{min-height:52px;border-radius:18px;background:var(--surface);font-size:1.0625rem;font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.btn.same{min-height:56px;font-size:1.1875rem;flex-direction:column;gap:0;line-height:1.2}
.btn.same small{font-size:.8125rem;font-weight:700;color:var(--sec)}
.btn.quiet{min-height:44px;background:none;font-size:1.0625rem;font-weight:700;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--text) 30%,transparent);text-underline-offset:4px}
.stack{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.btns{display:flex;flex-direction:column;gap:10px;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;font-size:.875rem;font-weight:800;line-height:1.2}
.chip svg{width:1.1rem;height:1.1rem;flex:none}
.chip.gold{background:color-mix(in srgb,var(--accent) 22%,var(--bg));color:var(--accent-text)}
.chip.green{background:var(--garden);color:var(--text)}
.chip.green svg{color:var(--ok)}
.chip.sky{background:var(--levels);color:var(--levels-ink)}
.home{height:5px;width:134px;border-radius:3px;background:color-mix(in srgb,var(--text) 70%,transparent);margin:8px auto 8px;flex:none}

/* ---------- garden panorama ---------- */
.pano{position:relative;width:393px;height:320px;flex:none}
.pano .hill{position:absolute;left:-14%;right:-14%}
.pano img{position:absolute;transform-origin:50% 92%}
.pano .moon{position:absolute;width:44px;height:44px;border-radius:50%;box-shadow:-10px 4px 0 0 var(--accent);transform:rotate(-20deg);top:6px;right:44px;display:none}
[data-theme=dark] .pano .moon{display:block}
.pano.gold img{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--accent) 70%,transparent))}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 2px color-mix(in srgb,var(--accent) 60%,transparent);display:none}
[data-theme=dark] .fly{display:block}
.sunsky{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--accent);top:72px;right:34px;box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 18%,transparent);z-index:1}
[data-theme=dark] .sunsky{display:none}
.petal{position:absolute;width:10px;height:7px;border-radius:70% 10% 70% 10%;background:var(--petal);opacity:.85;z-index:3;pointer-events:none}
.petal.g{background:var(--gold)}
.rm .petal{display:none}
.crownglow{position:relative;display:grid;place-items:center;width:240px;height:128px}
.crownglow:before{content:"";position:absolute;inset:-10px 10px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 34%,transparent),transparent)}
.crownglow svg{width:210px;position:relative}

.va{background:linear-gradient(180deg,var(--levels) 0,color-mix(in srgb,var(--bloom) 60%,var(--levels)) 400px,color-mix(in srgb,var(--bloom) 40%,var(--bg)) 600px,var(--bg) 660px)}
.va .top{padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:2}
.va .bottom{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 24px 0;gap:10px;background:var(--bg)}
.legend{display:flex;justify-content:center;gap:12px;font-size:.8125rem;font-weight:700;color:var(--sec);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend img{width:22px}

/* ---------- home beat ---------- */
.vh .bar{display:flex;flex-direction:column;align-items:center;padding:6px 20px 0;gap:10px}
.sign{position:relative;width:270px;height:96px}
.sign img{position:absolute;left:0;bottom:0;width:270px}
.sign svg{position:absolute;width:96px;left:10px;top:0;transform:rotate(-12deg)}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-weight:800;font-size:.9375rem;width:100%}
.toast svg{width:26px;flex:none;color:var(--accent-text)}
.feat{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--soft);width:100%}
.feat .pic{width:84px;height:84px;border-radius:16px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 26%,var(--bg)),var(--garden))}
.feat .pic img{width:74px}
.feat b{display:block;font-size:1.0625rem}.feat .t{flex:1;min-width:0}
.feat p{margin:2px 0 0;font-size:.9375rem;color:var(--sec);line-height:1.3}
.pips{display:flex;gap:4px;align-items:center;margin-top:6px;font-size:.8125rem;font-weight:800}
.pips i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 35%,transparent)}
.pips i.on{background:var(--accent);box-shadow:none}
.pips span{margin-left:6px}
.gold-look{filter:sepia(1) saturate(3.2) hue-rotate(-12deg) brightness(1.02) drop-shadow(0 0 5px rgba(240,180,60,.95))}

/* ---------- share sheet ---------- */
.behind{position:absolute;inset:0;filter:blur(2px)}
.dimmer{position:absolute;inset:0;background:var(--dim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 20px 0;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:3}
.grab{width:40px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--text) 25%,transparent)}
.sheet h2{margin:0;font-size:1.375rem;font-weight:800}
.card{width:345px;background:#FFFDF8;border-radius:14px;padding:9px 9px 0;box-shadow:var(--shadow);transform:rotate(-1.5deg);position:relative;flex:none;color:#2C3E2C}
[data-theme=dark] .card{background:#F3EEDF}
.card .pic{width:327px;height:226px;border-radius:8px;overflow:hidden;position:relative}
.card .pic .pano{transform:scale(.832);transform-origin:0 0;position:absolute;left:0;top:-40px}
.card .cap{display:flex;align-items:center;gap:10px;padding:8px 4px 10px}
.card .cap .t{flex:1}.card .cap b{display:block;font-size:1.0625rem;font-weight:800}.card .cap span{font-size:.875rem;font-weight:700;color:#3F5A3F}
.stamp{width:62px;height:54px;background:#FFF4DC;border:1.5px dashed #C88A1E;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(5deg);flex:none}
.stamp svg{width:46px}.stamp i{font-style:normal;font-size:9px;font-weight:800;color:#6E4600}
.gatenote{display:flex;gap:8px;align-items:center;font-size:.9375rem;font-weight:700;color:var(--sec)}
.gatenote svg{width:18px;height:18px;color:var(--levels-ink);flex:none}

/* ---------- what grows next ---------- */
.vn .wrap{flex:1;display:flex;flex-direction:column;padding:0 18px 0;gap:9px}
.vn .head{display:flex;flex-direction:column;align-items:center;gap:4px}
.vn .head svg.crown{width:132px}
.tile{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--soft)}
.tile .art{width:78px;flex:none;display:flex;align-items:flex-end;justify-content:center;min-height:78px;border-radius:14px;padding:4px 2px;position:relative}
.tile .t{flex:1;min-width:0}
.tile h2{font-size:1.125rem;margin:0 0 2px;font-weight:800}
.tile p{margin:0;font-size:.9375rem;line-height:1.3;color:var(--sec)}
.tile .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tile .tags span{font-size:.75rem;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:3px}
.tile .tags span.on{background:var(--accent);color:var(--ink);box-shadow:none}
.tile .tags span.on svg{width:.8rem;height:.8rem}
.tile .you{font-size:.875rem;font-weight:800;margin-top:5px;color:var(--text)}
.goldart{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 30%,var(--bg)),var(--garden))}
.goldart img{width:44px;margin:0 -6px}
.rankart{background:linear-gradient(180deg,var(--bloom),color-mix(in srgb,var(--bloom) 40%,var(--surface)))}
.rankart img{width:60px}
.bookart{background:linear-gradient(180deg,var(--visit),color-mix(in srgb,var(--visit) 40%,var(--surface)))}
.bookart svg{width:66px}
.windart{background:linear-gradient(180deg,var(--wind),var(--garden))}
.windart img{width:52px;transform:rotate(7deg);transform-origin:50% 90%}
.windart .w{position:absolute;left:6px;top:8px;width:38px;color:var(--levels-ink)}
.keep{display:block;text-wrap:balance;font-size:.9375rem;font-weight:700;color:var(--sec);text-align:center;margin:2px 0 0}
.keep svg{width:1.1rem;height:1.1rem;color:var(--ok);vertical-align:-3px;margin-right:6px}

/* ---------- weather puzzle ---------- */
.vr .nav{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:44px;flex:none;gap:8px}
.newp{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:14px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:inherit;font-weight:800;font-size:.9375rem;color:var(--text)}
.newp svg{width:1rem;height:1rem}
.newp small{font-weight:700;color:var(--sec);font-size:.8125rem}
.steps{display:flex;gap:6px;align-items:center;font-size:.875rem;font-weight:800}
.steps i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--ok)}
.scene{position:relative;height:var(--sh,118px);margin:0 16px;border-radius:22px;overflow:hidden;flex:none;
  background:linear-gradient(180deg,var(--wind) 0%,var(--dawn1) 65%,var(--garden) 100%)}
.scene .ground{position:absolute;left:-10%;right:-10%;bottom:-34px;height:66px;border-radius:50%;background:var(--h3)}
.scene img{position:absolute;bottom:8px;transform-origin:50% 88%}
.scene .bend{filter:saturate(.6)}
.scene .wl{position:absolute;color:color-mix(in srgb,var(--levels-ink) 55%,transparent);width:46px}
.leaf{position:absolute;width:11px;height:6px;border-radius:70% 10%;background:#6BA35C;opacity:.85}
.vr .main{padding:10px 18px 0;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.vr h1{font-size:1.5rem}
.reward{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px 8px 8px;border-radius:16px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent);text-align:left}
.reward .stk{width:46px;height:46px;flex:none}
.reward p{margin:0;font-size:.9375rem;font-weight:700;line-height:1.3}
.slotrows{display:flex;flex-direction:column;gap:6px;align-items:center}
.slots{display:flex;gap:4px;justify-content:center}
.slots i{width:40px;height:46px;border-radius:10px;background:var(--slot);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-style:normal;font-size:1.25rem;font-weight:800;position:relative}
.slots i.f{background:var(--tile);box-shadow:inset 0 0 0 2px var(--ok)}
.slots i.k{background:var(--tile);box-shadow:inset 0 0 0 2px var(--levels-ink)}
.slots i.k svg{position:absolute;top:2px;right:2px;width:12px;height:12px;color:var(--levels-ink)}
.slots i.next{box-shadow:inset 0 0 0 2px var(--text)}
.tiles{display:grid;grid-template-columns:repeat(7,44px);gap:6px;justify-content:center}
.tiles button{height:50px;border-radius:12px;border:0;background:var(--tile);box-shadow:0 2px 0 color-mix(in srgb,var(--text) 18%,transparent),inset 0 0 0 1px var(--line);font-family:inherit;font-size:1.375rem;font-weight:800;line-height:1;color:var(--text);padding:0}
.tiles button.used{opacity:.28;box-shadow:inset 0 0 0 1px var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.tools .btn{width:auto;flex:1 1 auto;min-height:48px;white-space:nowrap;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:1rem;font-weight:700;padding:8px 10px}
.tools .btn.peek{flex:1.6 1 auto;background:color-mix(in srgb,var(--accent) 24%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--accent)}
.ladder{display:flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:700;color:var(--sec);width:100%;justify-content:center;flex-wrap:wrap}
.ladder span{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.ladder span.done{background:var(--garden);box-shadow:none}
.ladder span.ready{background:color-mix(in srgb,var(--accent) 24%,var(--bg));box-shadow:inset 0 0 0 1px var(--accent);color:var(--text)}
.ladder svg{width:.9rem;height:.9rem}
.foot2{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px;padding-bottom:2px}
.choice{display:flex;gap:8px;width:100%}
.choice button{flex:1;min-height:52px;border-radius:16px;border:0;font:inherit;font-weight:800;font-size:1rem;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.choice button small{font-weight:700;font-size:.8125rem;color:var(--sec)}
.choice button.sel{box-shadow:inset 0 0 0 2.5px var(--ok);background:var(--garden)}
.catch{position:relative;flex:1;margin:10px 16px 0;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--dawn1),var(--dawn2) 60%,var(--garden));min-height:250px}
.catch .ground{position:absolute;left:-10%;right:-10%;bottom:-40px;height:90px;border-radius:50%;background:var(--h3)}
.catch img{position:absolute;bottom:22px;transform-origin:50% 88%}
.bfly{position:absolute;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:0;background:none}
.bfly svg{width:46px}
.counter{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9375rem;box-shadow:var(--soft);white-space:nowrap}

/* ---------- cap / mended ---------- */
.calm{position:relative;height:300px;flex:none;overflow:hidden;background:linear-gradient(180deg,var(--dawn1),var(--dawn2) 70%,var(--bg))}
.calm .ground{position:absolute;left:-20%;right:-20%;bottom:-90px;height:200px;border-radius:50%;background:var(--h3)}
.calm img{position:absolute;bottom:40px;transform-origin:50% 88%}
.vm .hero{position:relative;height:390px;flex:none;overflow:hidden;background:linear-gradient(180deg,var(--dawn1) 0%,var(--dawn2) 70%,var(--bg) 100%)}
.vm .ground{position:absolute;left:-30%;right:-30%;bottom:-130px;height:260px;border-radius:50%;background:var(--h3)}
.vm .hero img{position:absolute;bottom:64px}
.vm .bow{position:absolute;left:50%;top:70px;width:440px;height:440px;margin-left:-220px;border-radius:50%;
  background:radial-gradient(closest-side,transparent 80%,rgba(242,120,138,.24) 82%,rgba(232,168,56,.24) 87%,rgba(102,187,106,.22) 91%,rgba(140,196,236,.24) 95%,transparent 98%)}
.spark{position:absolute;color:var(--accent);width:22px}
.rm .spark.m{display:none}
.gains{width:100%;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:6px 14px;margin-top:-34px;position:relative;z-index:2}
.gain{display:flex;align-items:center;gap:12px;min-height:52px}
.gain+.gain{box-shadow:inset 0 1px 0 var(--line)}
.gain .ic{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px}
.gain .ic svg{width:34px}
.gain b{display:block;font-size:1rem;font-weight:800}.gain span{font-size:.8125rem;font-weight:700;color:var(--sec)}
.vm .rest,.vc2 .rest{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 22px}
.vm .rest .btns,.vc2 .rest .btns{margin-top:auto}
.tipcard{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--soft);font-size:.9375rem;font-weight:700;width:100%}
.tipcard svg{width:26px;flex:none;color:var(--levels-ink)}

/* ---------- settings ---------- */
.vs .nav{display:grid;grid-template-columns:88px 1fr 88px;align-items:center;min-height:44px;padding:0 8px;flex:none}
.vs .nav b{text-align:center;font-size:1.0625rem}
.vs .nav a{display:flex;align-items:center;gap:2px;color:var(--accent-text);font-weight:700;font-size:1.0625rem;min-height:44px;text-decoration:none}
.vs .nav a svg{width:20px}
.vs .wrap{padding:0 16px 0;display:flex;flex-direction:column;gap:4px;flex:1}
.vs h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--sec);margin:12px 16px 4px}
.group{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--soft)}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px}
.row+.row,.explain+.row{box-shadow:inset 0 1px 0 var(--line)}
.row.sub{padding-left:28px}
.row .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.row .ic svg{width:18px;height:18px}
.row .lab{flex:1;font-size:1.0625rem;font-weight:650;line-height:1.25}
.row .lab small{display:block;font-size:.8125rem;font-weight:700;color:var(--sec)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--toggle-off);position:relative;flex:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 40%,transparent)}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--ok);box-shadow:none}.sw.on:after{left:22px}
.explain{padding:2px 14px 12px 56px;font-size:.875rem;line-height:1.38;color:var(--sec)}
.explain.wild{padding-left:28px}
.explain p{margin:0 0 4px}
.foot{font-size:.8125rem;color:var(--sec);padding:6px 16px 0;line-height:1.35}

@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}15%{opacity:.85}100%{transform:translate(40px,260px) rotate(200deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flit{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-10px)}}
.anim .pano img{animation:sway 6s ease-in-out infinite}
.anim .petal{animation:fall 9s linear infinite}
.anim .bfly{animation:flit 4s ease-in-out infinite}
.anim .enter{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.rm .enter{animation:fade .3s ease-out both}
.static *{animation:none!important}
</style></head><body>
<div id="root"></div>
<script>
const q=new URLSearchParams(location.search);
const s=q.get('s')||'a', theme=q.get('theme')||'light', rm=q.get('rm')==='1', scale=q.get('scale')||'1', kid=q.get('kid')==='1';
document.documentElement.dataset.theme=theme;document.documentElement.style.setProperty('--scale',scale);
document.body.classList.add(rm?'rm':'anim');if(q.get('static')==='1')document.body.classList.add('static');if(q.get('tall')==='1')document.body.classList.add('tall');
const dark=theme==='dark';

const NAMES=['dandelion','daisy','clover','marigold','sunflower','tulip','rose','poppy','fern','strawberry',
 'orchid','lavender','lotus','jasmine','snapdragon','saguaro_cactus','aloe_vera','bamboo','hibiscus','cherry_blossom',
 'venus_flytrap','baobab','corpse_flower','welwitschia','dragon_blood_tree','pitcher_plant','sensitive_plant','bird_of_paradise','joshua_tree','lithops',
 'rafflesia','monkey_puzzle_tree','sago_palm','ghost_pipe','passionflower','king_protea','bleeding_heart','giant_water_lily','sundew','ladys_slipper_orchid',
 'wollemi_pine','jade_vine','coco_de_mer','black_bat_flower','franklin_tree','chocolate_cosmos','ghost_orchid','silversword','rainbow_eucalyptus','puya_raimondii'];
const P=n=>`../plants/plant_${n}.svg`;
// earned stage per plant (1 Tiny .. 4 Full bloom): first levels mostly grown, newest finds still small
const STAGE=[[4,4,3,4,4,4,3,4,4,4],[4,3,4,2,4,3,4,4,3,4],[3,2,4,1,3,2,4,2,3,3],[2,1,3,2,1,3,2,1,2,2],[1,2,1,1,2,1,1,2,1,1]];
const stageOf=k=>STAGE[Math.floor(k/10)][k%10];
const STAGE_SCALE={1:.5,2:.64,3:.8,4:1};

const I={
 sprout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9"/><path d="M12 12c0-4-3-6-7-6 0 4 3 6 7 6z" fill="currentColor"/><path d="M12 14c0-3.5 2.5-5.5 6.5-5.5 0 3.5-2.5 5.5-6.5 5.5z" fill="currentColor"/></svg>',
 sparkle:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.6L19.5 9l-5.7 1.6L12 16l-1.8-5.4L4.5 9l5.7-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l-6 6 6 6"/><path d="M4 12h16"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 pic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M6 16l4-4 3 3 2-2 3 3"/></svg>',
 share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg>',
 album:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 3v18"/><circle cx="14" cy="10" r="2.2"/></svg>',
 chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 wind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9h10a3 3 0 1 0-3-3"/><path d="M3 14h15a3 3 0 1 1-3 3"/><path d="M3 19h6"/></svg>',
 cloudwind:'<svg viewBox="0 0 24 24"><path d="M8 13h9.5a3.5 3.5 0 0 0 .5-7A5 5 0 0 0 8.6 7 3 3 0 0 0 8 13z" fill="currentColor"/><path d="M3 17h11M6 20.5h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
 note:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18a3 3 0 1 1-2-2.8V5l11-2v12a3 3 0 1 1-2-2.8V6.5l-7 1.3z"/></svg>',
 buzz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 9v6M20 9v6"/></svg>',
 lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
 shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3c5 0 5 10 10 10h3M17 14l3 3-3 3M4 17h3c1.6 0 2.6-1 3.4-2.3M13.6 9.3C14.4 8 15.4 7 17 7h3M17 4l3 3-3 3"/></svg>',
 water:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></svg>',
};

function crown(gold=false){
  const bz=(t,a,c,b)=>[(1-t)**2*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)**2*a[1]+2*(1-t)*t*c[1]+t*t*b[1]];
  const A=[8,40],B=[112,40],F=[60,66];
  const cols=gold?['#F2B705','#E8A838','#F6C445','#FFE08A','#E8A838','#F6C445','#F2B705']:['#F2788A','#E8A838','#B89AE0','#FFFFFF','#E8A838','#B89AE0','#F2788A'];
  let leaves='',flowers='';
  for(let i=0;i<=12;i++){const t=i/12,[x,y]=bz(t,A,F,B);leaves+=`<ellipse cx="${x}" cy="${y-2}" rx="7.5" ry="3.8" fill="${i%2?'#5E9E4E':'#3F8A4A'}" transform="rotate(${-40+i*7} ${x} ${y-2})"/>`;}
  cols.forEach((c,i)=>{const t=.08+i*(.84/6),[x,y]=bz(t,A,F,B);const r=i===3?8.5:6.6,lift=i===3?7:Math.abs(3-i)<2?3:0;
    let pet='';for(let k=0;k<5;k++){const a=k*72*Math.PI/180;pet+=`<circle cx="${(x+Math.sin(a)*r*.75).toFixed(1)}" cy="${(y-lift-Math.cos(a)*r*.75).toFixed(1)}" r="${(r*.62).toFixed(1)}" fill="${c}" stroke="${c==='#FFFFFF'?'#D9CBB0':'rgba(0,0,0,.12)'}" stroke-width=".8"/>`;}
    flowers+=pet+`<circle cx="${x}" cy="${y-lift}" r="${(r*.36).toFixed(1)}" fill="${gold?'#B5651D':(c==='#E8A838'?'#B5651D':'#F6C445')}"/>`;});
  return `<svg class="crown" viewBox="0 0 120 74" aria-hidden="true"><path d="M8 40Q60 16 112 40" fill="none" stroke="#6BA35C" stroke-width="3" opacity=".55" stroke-linecap="round"/>${leaves}<path d="M8 40Q60 66 112 40" fill="none" stroke="#3F8A4A" stroke-width="3.2" stroke-linecap="round"/>${flowers}</svg>`;
}
function butterfly(c1='#B89AE0',c2='#F2A0B0'){return `<svg viewBox="0 0 48 40" aria-hidden="true"><ellipse cx="14" cy="14" rx="12" ry="11" fill="${c1}"/><ellipse cx="34" cy="14" rx="12" ry="11" fill="${c1}"/><ellipse cx="16" cy="29" rx="8" ry="8" fill="${c2}"/><ellipse cx="32" cy="29" rx="8" ry="8" fill="${c2}"/><rect x="22.5" y="8" width="3" height="26" rx="1.5" fill="#4A3B2A"/><path d="M23 9q-3-6-7-7M25 9q3-6 7-7" stroke="#4A3B2A" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`;}
function frog(){return `<svg class="stk" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="25" r="21" fill="#fff" stroke="rgba(0,0,0,.12)"/><ellipse cx="24" cy="29" rx="15" ry="11" fill="#66BB6A"/><circle cx="16" cy="18" r="6" fill="#66BB6A"/><circle cx="32" cy="18" r="6" fill="#66BB6A"/><circle cx="16" cy="18" r="3.4" fill="#fff"/><circle cx="32" cy="18" r="3.4" fill="#fff"/><circle cx="16.6" cy="18.4" r="1.8" fill="#1F3320"/><circle cx="32.6" cy="18.4" r="1.8" fill="#1F3320"/><path d="M17 30q7 5 14 0" stroke="#1F3320" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="13" cy="28" r="2" fill="#F2A0B0"/><circle cx="35" cy="28" r="2" fill="#F2A0B0"/></svg>`;}
function book(){return `<svg viewBox="0 0 64 52" aria-hidden="true"><path d="M32 10C24 4 12 4 4 7v38c8-3 20-3 28 3z" fill="#FFFDF8" stroke="#B89AE0" stroke-width="2"/><path d="M32 10c8-6 20-6 28-3v38c-8-3-20-3-28 3z" fill="#FFFDF8" stroke="#B89AE0" stroke-width="2"/><g transform="translate(8 16) scale(.42)">${butterfly().replace(/<\/?svg[^>]*>/g,'')}</g><circle cx="46" cy="27" r="8" fill="#66BB6A"/><circle cx="43" cy="24" r="2" fill="#fff"/><circle cx="49" cy="24" r="2" fill="#fff"/></svg>`;}
function weatheredBadge(){return `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#FFF4DC" stroke="#E8A838" stroke-width="2"/><path d="M16 26V15" stroke="#3F8A4A" stroke-width="2.4" stroke-linecap="round"/><path d="M16 19c0-3-2.5-4.5-5.5-4.5 0 3 2.5 4.5 5.5 4.5zM16 17c0-3 2.5-4.5 5.5-4.5 0 3-2.5 4.5-5.5 4.5z" fill="#3F8A4A"/><path d="M7 9h7M9 12h5" stroke="#5E9FCC" stroke-width="1.8" stroke-linecap="round"/></svg>`;}

const petals=(list)=>list.map(([x,y,r,g],i)=>`<i class="petal ${g?'g':''}" aria-hidden="true" style="left:${x}px;top:${y}px;transform:rotate(${r}deg);animation-delay:${i*1.3}s"></i>`).join('');

// panorama, 12+11+10+9+8 = 50. mode: 'earned' (stage sizes) or 'full'/'gold'
function pano(mode='earned',label='Your garden with all 50 plants'){
  const rows=[[12,40,226],[11,46,180],[10,52,132],[9,58,84],[8,66,30]];
  const hills=['--h1','--h2','--h3','--h4','--h5'];
  let k=49,html='<span class="moon" aria-hidden="true"></span>';
  html+=[[60,40],[150,24],[300,90],[220,60],[30,110]].map(([x,y])=>`<i class="fly" style="left:${x}px;top:${y}px"></i>`).join('');
  rows.forEach(([n,sz,b],r)=>{
    const pad=10,step=(393-2*pad)/n;
    html+=`<span class="hill" aria-hidden="true" style="bottom:0;height:${b+sz*.18}px;background:var(${hills[r]});border-radius:${r%2?'55% 45%':'45% 55%'} 0 0/${70+r*6}px ${60+r*6}px 0 0"></span>`;
    for(let i=0;i<n;i++){
      const st=mode==='earned'?stageOf(k):4, w=sz*STAGE_SCALE[st];
      const jitter=((i*37+r*11)%9)-4, x=pad+i*step+step/2-w/2+jitter, y=b-sz*.08+((i+r)%2?3:0);
      html+=`<img src="${P(NAMES[k--])}" alt="" style="left:${x.toFixed(1)}px;bottom:${y}px;width:${w.toFixed(1)}px;animation-delay:${(i*.4+r*.7)%5}s">`;
    }
  });
  return `<div class="pano ${mode==='gold'?'gold':''}" role="img" aria-label="${label}">${html}</div>`;
}
const status=()=>`<div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>`;
// bent tall plants for the weather scenes
const bent=(list)=>list.map(([n,x,w,deg,sat])=>`<img class="${sat?'bend':''}" src="${P(n)}" alt="" style="left:${x}px;width:${w}px;transform:rotate(${deg}deg) skewX(${deg>0?-4:0}deg)">`).join('');
const windLines=(list)=>list.map(([x,y,w])=>`<span class="wl" style="left:${x}px;top:${y}px;width:${w}px">${I.wind}</span>`).join('');
const navWeather=(right)=>`<div class="nav"><span class="chip sky" role="text">${I.wind}Big wind</span>${right||''}</div>`;
const reward=`<div class="reward" role="text">${frog()}<p>Solve it for the Frog friend sticker and a word toward your next plant.</p></div>`;
const skipBtn=`<button class="btn secondary same">Skip for now<small>Care will help it mend.</small></button>`;
let out='';

if(s==='a'||s==='gold'){
  const g=s==='gold';
  out=`<div class="phone va">${status()}<span class="sunsky" aria-hidden="true"></span>
    ${petals([[30,140,20],[350,170,-30,1],[70,70,60],[20,320,10,1],[360,290,40]])}
    <div class="top enter">
      <div class="crownglow" aria-hidden="true">${crown(g)}</div>
      <span class="chip gold" role="text">${I.sparkle}${g?'Your crown turned gold':"You earned the Gardener's Crown"}</span>
      <h1 id="h">${g?'Your whole garden is in full bloom.':'Every plant found!'}</h1>
      <p class="body">${g?'Every plant is fully grown. What a sight!':'You found all 50. What a garden! The crown is yours to keep.'}</p>
    </div>
    ${pano(g?'gold':'earned',g?'Your garden with all 50 plants in full bloom':'Your garden with all 50 plants, some still growing')}
    <div class="bottom">
      ${g?'':`<div class="legend" aria-hidden="true"><span><img src="${P('daisy')}" alt="" style="width:14px">Still growing</span><span><img src="${P('daisy')}" alt="">Full bloom</span></div>`}
      <div class="btns">${g?'<button class="btn primary">Lovely</button>':'<button class="btn primary">See what grows next</button><button class="btn secondary">Walk my garden</button>'}</div>
      <div class="home"></div>
    </div></div>`;
}

else if(s==='home'){
  const wm=dark?'../logo/final/wordmark-dark.svg':'../logo/final/wordmark.svg';
  out=`<div class="phone vh">${status()}
    <div class="bar">
      <div class="sign enter" role="img" aria-label="WordFlora, wearing the Gardener's Crown">${crown()}<img src="${wm}" alt=""></div>
      <div class="toast" role="status">${I.sparkle}<span>The Gardener's Crown is on your garden sign.</span></div>
      <div class="feat"><div class="pic"><img class="gold-look" src="${P('daisy')}" alt=""></div>
        <div class="t"><b>Daisy is 3 days from golden</b><p>Care for it today to help it shine.</p>
        <div class="pips" role="text" aria-label="4 of 7 care days">${[1,1,1,1,0,0,0].map(o=>`<i class="${o?'on':''}"></i>`).join('')}<span>4 of 7</span></div></div></div>
      <div class="feat"><div class="pic" style="background:linear-gradient(180deg,var(--bloom),var(--surface))"><img src="../flowers/flower_8.svg" alt="" style="width:58px"></div>
        <div class="t"><b>Daily Bloom</b><p>A new word is ready. You are a Bud.</p></div></div>
      <div class="btns" style="margin-top:8px"><button class="btn primary">Play</button><button class="btn secondary">My garden</button></div>
    </div>
    <div style="flex:1"></div><div class="home"></div></div>`;
}

else if(s==='share'){
  out=`<div class="phone">
    <div class="behind va" aria-hidden="true">${status()}<div style="height:40px"></div>${pano()}</div><div class="dimmer"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="h"><span class="grab"></span>
      <h2 id="h">Share your garden</h2>
      <div class="card" role="img" aria-label="Postcard: My WordFlora garden, 50 of 50 plants, Gardener's Crown stamp">
        <div class="pic va">${pano()}</div>
        <div class="cap"><div class="t"><b>My WordFlora garden</b><span>50 of 50 plants</span></div><div class="stamp" aria-hidden="true">${crown()}<i>50 OF 50</i></div></div>
      </div>
      <div class="btns" style="margin-top:4px">
        ${kid?`<button class="btn primary">${I.lock}Ask a grown-up to share</button>`:`<button class="btn primary">${I.share}Share my postcard</button>`}
        <button class="btn secondary">${I.album}Keep in my album</button>
        ${kid?`<div class="gatenote" style="justify-content:center">${I.lock}A grown-up check comes first.</div>`:''}
        <button class="btn quiet">Close</button>
      </div>
      <div class="home"></div>
    </div></div>`;
}

else if(s==='next'){
  const ranks=['Seedling','Sprout','Bud','Bloom','Full bloom','Evergreen'];
  out=`<div class="phone vn">${status()}
   <div class="wrap">
    <div class="head enter">${crown()}<h1 id="h">What grows next</h1><p class="body">Your garden keeps growing.</p></div>
    <div class="tile"><div class="art goldart" aria-hidden="true"><img src="${P('daisy')}" alt=""><img class="gold-look" src="${P('daisy')}" alt=""></div>
      <div class="t"><h2>Golden blooms</h2><p>Care for a plant on 7 different days to make it golden.</p>
      <div class="pips" role="text" aria-label="Daisy, 4 of 7 care days">${[1,1,1,1,0,0,0].map(o=>`<i class="${o?'on':''}"></i>`).join('')}<span>Daisy 4 of 7</span></div></div></div>
    <div class="tile"><div class="art rankart" aria-hidden="true"><img src="../flowers/flower_8.svg" alt=""></div>
      <div class="t"><h2>Bloom ranks</h2><p>Every Daily Bloom you play counts. Ranks go up, never down.</p>
      <div class="tags" aria-hidden="true">${ranks.map(r=>`<span class="${r==='Bud'?'on':''}">${r==='Bud'?I.check:''}${r}</span>`).join('')}</div>
      <div class="you">You are a Bud.</div></div></div>
    <div class="tile"><div class="art bookart" aria-hidden="true">${book()}</div>
      <div class="t"><h2>Visitors' book</h2><p>A page for every visitor you meet, and your weather stickers.</p></div></div>
    <div class="tile"><div class="art windart" aria-hidden="true"><span class="w">${I.wind}</span><img src="${P('sunflower')}" alt=""></div>
      <div class="t"><h2>Garden weather</h2><p>Some days bring wind or frost. Your plants bounce back with care.</p></div></div>
    <p class="keep">${I.sprout}Your crown and all your plants stay with you.</p>
    <div class="btns" style="margin-top:auto"><button class="btn primary">Back to my garden</button></div>
    <div class="home"></div>
   </div></div>`;
}

else if(s==='intro'){
  out=`<div class="phone vr">${status()}${navWeather()}
    <div class="scene" style="--sh:210px" aria-hidden="true">${windLines([[24,30,46],[300,50,40],[150,20,34]])}<span class="ground"></span>
      <i class="leaf" style="left:90px;bottom:14px;transform:rotate(-20deg)"></i><i class="leaf" style="left:280px;bottom:16px;transform:rotate(30deg)"></i>
      ${bent([['snapdragon',40,92,24,1],['sunflower',140,118,26,1],['bird_of_paradise',246,98,20,1]])}</div>
    <div class="main">
      <h1 id="h">Weather puzzle</h1>
      <p class="body">The big wind bent some tall plants. Solve it to help your garden stand tall.</p>
      ${reward}
      <div class="choice" role="radiogroup" aria-label="Puzzle kind"><button class="sel" role="radio" aria-checked="true">Gentle<small>5 to 10 letters</small></button><button role="radio" aria-checked="false">A harder one<small>Longer names</small></button></div>
      <div class="foot2"><button class="btn primary">Start</button>${skipBtn}</div>
    </div><div class="home"></div></div>`;
}

else if(s==='puzzle'){
  const A=['VENUS','FLYTRAP'];
  const st={0:'k',1:'f',2:'f'}; let idx=0;
  const rows=A.map(w=>`<div class="slots">${w.split('').map(ch=>{const i=idx++;const c=st[i];return `<i class="${c||''} ${i===3?'next':''}" aria-label="${c==='k'?ch+', peeked':c?ch:'open spot'}">${c?ch:''}${c==='k'?I.eye:''}</i>`}).join('')}</div>`).join('');
  const tiles=['T','U','K','A','V','R','E','S','P','Y','N','L','F'], used=[4,6,10];
  out=`<div class="phone vr">${status()}${navWeather(`<button class="newp" aria-label="New puzzle, 2 more today">${I.shuffle}New puzzle</button>`)}
    <div class="scene" aria-hidden="true">${windLines([[24,20,40],[300,30,36]])}<span class="ground"></span>
      ${bent([['snapdragon',70,70,24,1],['sunflower',160,84,26,1],['bird_of_paradise',250,72,20,1]])}</div>
    <div class="main">
      <h1 id="h">Weather puzzle</h1>
      ${reward}
      <span class="chip green" role="text">${I.sprout}A plant name: 2 words, 12 letters</span>
      <div class="slotrows" role="group" aria-label="Your answer, 3 of 12 letters">${rows}</div>
      <div class="tiles" role="group" aria-label="Letters">${tiles.map((t,i)=>`<button class="${used.includes(i)?'used':''}" aria-label="${t}${used.includes(i)?', placed':''}">${t}</button>`).join('')}</div>
      <div class="tools"><button class="btn" aria-label="Take back a letter">${I.back}Take back</button><button class="btn">Clear</button><button class="btn peek">${I.eye}Peek a letter</button></div>
      <div class="ladder" role="text" aria-label="Free peeks: one used, one ready, then a picture clue after two peeks"><span class="done">${I.check}Peek</span><span class="ready">${I.eye}Peek</span><span>${I.pic}Picture clue after 2 peeks</span></div>
      <div class="foot2">${skipBtn}</div>
    </div><div class="home"></div></div>`;
}

else if(s==='part2'){
  out=`<div class="phone vr">${status()}
    <div class="nav"><span class="chip sky" role="text">${I.wind}Wild Weather</span><span class="steps" role="text" aria-label="Part 2 of 2"><i class="on"></i><i class="on"></i><span style="margin-left:4px">Part 2 of 2</span></span></div>
    <div class="main" style="flex:none;padding-top:4px">
      <h1 id="h">Venus Flytrap! Well done.</h1>
      <p class="body">Now catch 3 butterflies to lift your garden.</p>
    </div>
    <div class="catch" aria-label="Butterfly garden">
      <span class="counter" role="status">1 of 3 butterflies</span><span class="ground"></span>
      ${bent([['snapdragon',36,84,6,0],['sunflower',140,112,8,0],['venus_flytrap',262,76,0,0]])}
      <button class="bfly" style="left:40px;top:80px" aria-label="Butterfly">${butterfly()}</button>
      <button class="bfly" style="left:270px;top:110px;animation-delay:1.2s" aria-label="Butterfly">${butterfly('#8CC4EC','#F6C445')}</button>
    </div>
    <div class="main" style="flex:none;padding-top:10px">
      <div class="foot2"><button class="btn secondary">${I.shuffle}Try a word instead</button>${skipBtn}</div>
    </div><div class="home"></div></div>`;
}

else if(s==='cap'){
  out=`<div class="phone vc2">${status()}
    <div class="calm" aria-hidden="true"><span class="ground"></span>
      ${bent([['snapdragon',50,90,8,0],['sunflower',140,120,10,0],['bird_of_paradise',254,96,6,0]])}</div>
    <div class="rest">
      <h1 id="h" style="margin-top:14px">That is plenty for today.</h1>
      <p class="body">Your garden will mend with care. A new puzzle comes tomorrow.</p>
      <div class="tipcard">${I.water}<span>Water or say hello to a plant. It helps it stand tall.</span></div>
      <div class="btns"><button class="btn primary">Back to my garden</button></div>
      <div class="home"></div>
    </div></div>`;
}

else if(s==='mended'){
  const sp=[[64,96,1],[318,150,1],[100,220,0],[280,74,0],[340,250,1],[40,280,0]];
  out=`<div class="phone vm">
    <div class="hero" aria-hidden="true">${status()}<span class="bow"></span><span class="ground"></span>
      ${sp.map(([x,y,m],i)=>`<span class="spark ${m?'m':''}" style="left:${x}px;top:${y}px;width:${i%2?16:22}px">${I.sparkle}</span>`).join('')}
      <img class="enter" src="${P('snapdragon')}" alt="" style="left:36px;width:110px">
      <img class="enter" src="${P('sunflower')}" alt="" style="left:122px;width:150px">
      <img class="enter" src="${P('bird_of_paradise')}" alt="" style="left:250px;width:116px">
      ${petals([[150,120,30,1],[240,190,-20]])}
    </div>
    <div class="rest">
      <div class="gains enter" role="list" aria-label="You earned">
        <div class="gain" role="listitem"><span class="ic">${frog()}</span><span><b>New sticker: Frog friend</b><span>In your Visitors' book</span></span></div>
        <div class="gain" role="listitem"><span class="ic" style="background:var(--garden);color:var(--ok)">${I.sprout}</span><span><b>+1 word toward your next plant</b><span>Counts like a Daily Bloom win</span></span></div>
        <div class="gain" role="listitem"><span class="ic">${weatheredBadge()}</span><span><b>Weathered: 1 of 3</b><span>A step on your badge</span></span></div>
      </div>
      <h1 id="h" style="margin-top:4px">You solved it!</h1>
      <p class="body">Your whole garden is standing tall.</p>
      <div class="btns"><button class="btn primary">Back to my garden</button></div>
      <div class="home"></div>
    </div></div>`;
}

else if(s==='settings'){
  out=`<div class="phone vs">${status()}
    <div class="nav"><a href="#">${I.chevL}Home</a><b>Settings</b><span></span></div>
    <div class="wrap">
      <h2>Play</h2>
      <div class="group">
        <div class="row"><span class="ic" style="background:var(--bloom);color:var(--bloom-ink)">${I.note}</span><span class="lab">Sounds</span><span class="sw on" role="switch" aria-checked="true" aria-label="Sounds"></span></div>
        <div class="row"><span class="ic" style="background:var(--levels);color:var(--levels-ink)">${I.buzz}</span><span class="lab">Gentle buzz</span><span class="sw on" role="switch" aria-checked="true" aria-label="Gentle buzz"></span></div>
      </div>
      <h2>Weather</h2>
      <div class="group">
        <div class="row"><span class="ic" style="background:var(--wind);color:var(--levels-ink)">${I.cloudwind}</span><span class="lab">Garden weather</span><span class="sw on" role="switch" aria-checked="true" aria-label="Garden weather, on"></span></div>
        <div class="explain">Some days bring wind, frost or puddles. Plants look windswept for a little while, and care helps them stand tall.</div>
        <div class="row sub"><span class="ic" style="background:var(--visit);color:var(--visit-ink)">${I.bell}</span><span class="lab">Tell me about garden weather</span><span class="sw" role="switch" aria-checked="false" aria-label="Tell me about garden weather, off"></span></div>
        <div class="row sub"><span class="ic" style="background:color-mix(in srgb,var(--accent) 26%,var(--bg));color:var(--accent-text)">${I.wind}</span><span class="lab">Wild Weather<small>For ages 13 and up</small></span><span class="sw" role="switch" aria-checked="false" aria-label="Wild Weather, for ages 13 and up, off"></span></div>
        <div class="explain wild"><p>Big storms can make up to 4 plants look one step smaller for a few days. Care or the Weather puzzle brings them back. Your level, plants, pots and badges always stay yours.</p><p>No timer. You can turn it off any time.</p></div>
      </div>
      <p class="foot">Wild Weather starts off and never turns on by itself. A card checks with you before it turns on.</p>
    </div><div class="home"></div></div>`;
}
document.getElementById('root').innerHTML=out;
</script>
</body></html>
