       Anchor = the bloom centre it replaces, at (50,40) in this box. -->
  <path d="M50 96 C 50 76 52 62 56 52" stroke="#8E9A5A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <g transform="rotate(28 50 40)">
    <path d="M50 40 C 36 34 28 42 30 52 C 40 54 48 48 50 40 Z" fill="#D4B08A" stroke="#A9825A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M50 40 C 64 34 72 42 70 52 C 60 54 52 48 50 40 Z" fill="#D4B08A" stroke="#A9825A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M50 40 C 44 26 50 16 56 20 C 60 26 56 36 50 40 Z" fill="#CBA47C" stroke="#A9825A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M50 40 C 40 46 38 60 46 64 C 52 60 52 48 50 40 Z" fill="#C79E74" stroke="#A9825A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M50 40 C 56 50 64 58 60 66 C 52 64 50 50 50 40 Z" fill="#CBA47C" stroke="#A9825A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M36 40 Q 40 42 44 41 M62 42 Q 58 44 56 42" stroke="#A9825A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="40" r="6.5" fill="#B08A3E" stroke="#8A6A2E" stroke-width="1.8"/>
    <circle cx="48" cy="38.5" r="1.4" fill="#8A6A2E"/><circle cx="52.5" cy="41" r="1.2" fill="#8A6A2E"/>
