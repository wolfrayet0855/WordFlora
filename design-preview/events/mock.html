<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather days</title>
<!-- Params: s=warn-wind|warn-dry|chips|dry|bugs|wind|frost|heat|hail|flood|shrug|bar|shed|set-wind   theme=light|dark   rm=1 (Reduce Motion: still picture)   static=1 (no animation; used for PNGs)
-->
<style>
:root,[data-theme=light]{
  --bg:#FAF7F0;--surface:#FFFFFF;--text:#2C3E2C;--accent:#E8A838;--ink:#1F3320;--ok:#2E7D32;--ok-bg:#E3F1DD;
  --sec:color-mix(in srgb,var(--text) 88%,transparent);--line:color-mix(in srgb,var(--text) 14%,transparent);
  --soil:#7A5238;--soil-dry:#C9A070;--crack:#6B4630;--pot:#C8734A;--pot-rim:#DD8C63;--shelf:#E3D9C0;
  --rain:#4C7396;--swoosh:#FFFFFF;--pellet:#FFFFFF;--pellet-edge:#7F95A9;--ring:#8A5A2B;--net:#2C3E2C;--water:rgba(95,165,230,.42);--water-line:#BFE0F7;
  --shadow:0 6px 18px rgba(44,62,44,.12)}
[data-theme=dark]{
  --bg:#1A2E1A;--surface:#2C3E2C;--text:#D4EDD4;--accent:#F0C060;--ink:#1A2E1A;--ok:#81C784;--ok-bg:#35523A;
  --sec:color-mix(in srgb,var(--text) 88%,transparent);--line:color-mix(in srgb,var(--text) 18%,transparent);
  --soil:#A47550;--soil-dry:#D2AE7C;--crack:#6B4630;--pot:#C8734A;--pot-rim:#DD8C63;--shelf:#3A503A;
  --rain:#A9CBEA;--swoosh:#D4EDD4;--pellet:#F2F7FB;--pellet-edge:#7F95A9;--ring:#E0B070;--net:#D4EDD4;--water:rgba(120,185,240,.38);--water-line:#CBE6FA;
  --shadow:0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:#888;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text)}
.phone{width:393px;height:852px;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.status{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font:600 15px system-ui}
.pad{padding:0 16px}
.nav{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 4px}
.back{min-width:44px;min-height:44px;display:flex;align-items:center;gap:2px;font-weight:650;font-size:17px;color:var(--text)}
.back svg{width:22px;height:22px}
.navt{font-size:20px;font-weight:800}
.navr{min-width:44px;display:flex;justify-content:flex-end}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;font-family:inherit;padding:10px 16px;text-align:center}
.btn.primary{min-height:56px;border-radius:18px;background:var(--accent);color:var(--ink);font-size:20px;font-weight:800}
.btn.secondary{min-height:48px;border-radius:16px;background:var(--surface);color:var(--text);font-size:17px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.quiet{min-height:44px;background:none;color:var(--text);font-size:17px;font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.btn svg{width:22px;height:22px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 14px 4px 10px;border-radius:999px;font-weight:800;font-size:16px;background:color-mix(in srgb,var(--ev) 26%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ev) 70%,var(--text) 20%);color:var(--text)}
.pill svg{width:22px;height:22px}
.pill.tag{font-size:14px;min-height:30px}
.rmtag{position:absolute;top:156px;left:28px;z-index:9;background:var(--surface);color:var(--text);font-size:13px;font-weight:800;border-radius:999px;padding:5px 10px;box-shadow:inset 0 0 0 1.5px var(--line)}

/* stage (plant + pot + weather) */
.stage{position:relative;width:361px;height:310px;border-radius:28px;overflow:hidden;margin:0 auto;flex:none;box-shadow:var(--shadow)}
.stage{--sky-b:color-mix(in srgb,var(--ev) 22%,var(--surface))}
.stage .sky{position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--ev) 34%,var(--surface)),color-mix(in srgb,var(--ev) 12%,var(--surface)))}
.stage .lay{position:absolute;inset:0;width:100%;height:100%}
.stage .plant{position:absolute;left:70px;top:14px;width:220px;height:220px;transform-origin:50% 88%}
.haze{position:absolute;inset:0;pointer-events:none}
.ev-dry,.ev-shrug{--ev:#E3A23C}.ev-bugs{--ev:#8FB052}.ev-wind{--ev:#7FA0BD}.ev-frost{--ev:#8CCBEA}.ev-heat{--ev:#F08A3C}.ev-hail{--ev:#9DB0C2}.ev-flood{--ev:#4F93CF}.ev-calm{--ev:#9CCB7A}.ev-warn{--ev:#7FA0BD}
.cap{padding:14px 20px 0;text-align:center}
.cap h2{font-size:22px;line-height:1.2;margin:0;font-weight:800;text-wrap:balance}
.cap p{font-size:16px;line-height:1.35;margin:4px 0 0;color:var(--sec);text-wrap:balance}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.growth{padding:12px 16px 12px;margin:12px 16px 0}
.growth .row{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}
.rest-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--ok-bg);color:var(--text)}
.growth svg.path{display:block;width:100%;height:auto;margin-top:2px}
.growth .note{font-size:14px;line-height:1.35;color:var(--sec);margin:2px 0 0;text-align:center}
.act{padding:12px 16px 0;display:flex;flex-direction:column;gap:2px}
.hint{font-size:14px;color:var(--sec);text-align:center;line-height:1.3;padding:6px 24px 0}
.spacer{flex:1}

/* warning card */
.hi{padding:6px 20px 12px;display:flex;justify-content:space-between;align-items:center}
.hi h1{margin:0;font-size:28px;font-weight:800}
.coin{min-width:44px;height:44px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-weight:800;font-size:15px;padding:0 12px}
.warn{margin:0 16px;overflow:hidden}
.warn .art{height:150px;display:block;width:100%}
.warn .in{padding:12px 18px 14px}
.warn h2{margin:0;font-size:24px;line-height:1.15;font-weight:800;text-wrap:balance}
.warn .lead{font-size:17px;margin:4px 0 8px;color:var(--sec)}
.steps{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:12px;min-height:44px;font-size:17px;font-weight:650;line-height:1.25}
.steps .n{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:16px;background:color-mix(in srgb,var(--ev) 30%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 62%,transparent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 16px 0}
.tile{height:92px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);padding:12px 14px;font-weight:800;font-size:17px;display:flex;flex-direction:column;justify-content:space-between}
.tile i{display:block;height:8px;width:60%;border-radius:4px;background:var(--line)}
.tile.wide{grid-column:span 2;height:84px}

/* garden header / chips */
.garden-h{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px;gap:8px}
.garden-h h1{margin:0;font-size:28px;font-weight:800}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 16px 0}
.gcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:8px 6px 10px;text-align:center;font-weight:700;font-size:14px;position:relative}
.gcard img{width:84px;height:84px;display:block;margin:0 auto}
.gcard .badge{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.sect{margin:18px 20px 8px;font-size:15px;font-weight:800;color:var(--sec)}
.wall{margin:0 16px;border-radius:30px;padding:18px 14px;background:linear-gradient(160deg,#6F8FB4,#8E7BB5 60%,#D69A82)}
.widget{background:rgba(255,255,255,.92);color:#2C3E2C;border-radius:24px;padding:14px 16px;display:flex;gap:12px;align-items:center;height:130px}
[data-theme=dark] .widget{background:rgba(32,48,32,.92);color:#D4EDD4}
.widget .wt{font-size:13px;font-weight:800;opacity:.85;display:flex;align-items:center;gap:6px}
.widget .wl{font-size:18px;font-weight:800;line-height:1.2;margin-top:4px}
.widget .ws{font-size:14px;margin-top:4px;line-height:1.3;opacity:.9}
.widget img{width:84px;height:84px;flex:none}
.lock{margin:12px 16px 0;border-radius:22px;padding:14px;background:linear-gradient(160deg,#42557A,#6E5C93);color:#fff;text-align:center}
.lock .t{font-size:44px;font-weight:300;letter-spacing:-1px;line-height:1}
.lock .inline{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;margin-top:6px}
.cap2{margin:6px 20px 0;font-size:14px;color:var(--sec);line-height:1.3}

/* bar screen */
.barc{margin:10px 16px 0;padding:12px 16px 10px}
.barc h3{margin:0 0 2px;font-size:17px;font-weight:800}

/* shed */
.shed-h{padding:2px 20px 8px}
.shed-h h2{margin:0;font-size:24px;font-weight:800}
.shed-h p{margin:4px 0 0;font-size:15px;line-height:1.35;color:var(--sec)}
.tool{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 16px 8px;min-height:84px}
.tool .ic{width:52px;height:52px;flex:none}
.tool .tx{flex:1;min-width:0}
.tool .nm{font-weight:800;font-size:17px}
.tool .us{font-size:14px;line-height:1.3;color:var(--sec);margin-top:1px}
.tool .go{width:92px;flex:none}
.tool .go .btn{min-height:44px;border-radius:14px;font-size:16px;font-weight:800;padding:6px 8px}
.btn.set{background:var(--ok-bg);color:var(--text);box-shadow:inset 0 0 0 2px var(--ok)}
.tool.todo .ic{opacity:.45}
.tool.todo .go{font-size:13px;font-weight:700;color:var(--sec);text-align:center;line-height:1.25}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--sec);margin:6px 20px 8px}

@keyframes sway{0%,100%{transform:rotate(13deg) skewX(-5deg)}50%{transform:rotate(17deg) skewX(-7deg)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-14px,22px)}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:.8}}
.anim .ev-wind .plant{animation:sway 5s ease-in-out infinite}
.anim .rainy{animation:drift 2.4s linear infinite}
.anim .shim{animation:shimmer 4s ease-in-out infinite}
.static *{animation:none!important}
.stage>.pill{position:absolute;top:10px;left:10px;z-index:6;min-height:36px}
.puz{margin:10px 16px 0;padding:10px 12px;display:flex;align-items:center;gap:10px}
.puz .fr{width:44px;height:44px;flex:none}
.puz .tx{flex:1;min-width:0;font-size:14px;line-height:1.3;color:var(--sec)}
.puz .tx b{display:block;color:var(--text);font-size:16px;margin-bottom:1px}
.puz .btn{width:76px;min-height:44px;border-radius:14px;font-size:16px;padding:6px}
.dn{margin:8px 16px 0;padding:8px 12px;border:1.5px dashed var(--line);border-radius:12px;font-size:12.5px;line-height:1.35;color:var(--sec)}
.dn b{color:var(--text)}
.tool .go.ready{display:flex;align-items:center;justify-content:center;gap:4px;min-height:44px;font-size:16px;font-weight:800;color:var(--text)}
.tool .go.ready svg{width:18px;height:18px;color:var(--ok)}
.tint{fill:color-mix(in srgb,var(--ev) 38%,transparent)}
.setbtn{margin:2px 0 8px 42px;width:calc(100% - 42px)}
.kit6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:0 14px;margin-top:6px}
.kit6 svg{width:100%;height:auto}
.hdr{padding:4px 20px 8px;font-weight:800}
.ax .phone{height:auto;min-height:852px;overflow:visible}
.ax .warn h2{font-size:34px}.ax .warn .lead{font-size:26px}.ax .steps li{font-size:26px;min-height:64px}.ax .steps .n{width:44px;height:44px;font-size:24px}
.ax .btn.primary{font-size:28px;min-height:76px}.ax .btn.secondary{font-size:26px;min-height:68px}.ax .btn.quiet{font-size:26px;min-height:60px}
.ax .cap h2{font-size:34px}.ax .cap p{font-size:24px}.ax .growth .row{font-size:22px}.ax .growth .note{font-size:20px}.ax .rest-chip{font-size:20px}
.ax .tool{flex-wrap:wrap}.ax .tool .nm{font-size:28px}.ax .tool .us{font-size:22px}.ax .tool .go{width:100%}.ax .tool .go .btn{font-size:24px;min-height:60px}.ax .tool .go.ready{font-size:22px}
.ax .shed-h h2{font-size:32px}.ax .shed-h p{font-size:22px}.ax .puz .tx{font-size:20px}.ax .puz .tx b{font-size:24px}.ax .puz{flex-wrap:wrap}.ax .puz .btn{width:100%;font-size:24px;min-height:60px}.ax .hint{font-size:20px}
.ax .navt,.ax .back{font-size:24px}.ax .pill{font-size:22px}
</style></head><body>
<div id="root"></div>
<script>
const q=new URLSearchParams(location.search);
let S=q.get('s')||'dry';const theme=q.get('theme')||'light';
const AX=S.startsWith('ax-');if(AX)S=S.slice(3);
const RM=q.get('rm')==='1'||/-rm$/.test(S);S=S.replace(/-rm$/,'');
document.documentElement.setAttribute('data-theme',theme);
const sv=(p,x='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${x}>${p}</svg>`;
const IC={
 back:sv('<path d="M15 5l-7 7 7 7"/>','stroke-width="2.4"'),
 check:sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>','stroke-width="3"'),
 wind:sv('<path d="M3 9h11a3 3 0 1 0-3-3"/><path d="M3 14h15a3 3 0 1 1-3 3"/><path d="M3 19h6"/>'),
 sun:sv('<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'),
 hot:sv('<circle cx="12" cy="8" r="3.4"/><path d="M12 1.8v1.4M5.8 8H4.4M19.6 8h-1.4M7.6 3.6l1 1M16.4 3.6l-1 1"/><path d="M4 15c2-1.6 3-1.6 5 0s3 1.6 5 0 3-1.6 6 0M4 20c2-1.6 3-1.6 5 0s3 1.6 5 0 3-1.6 6 0"/>'),
 bug:sv('<ellipse cx="12" cy="14" rx="5" ry="6.5"/><circle cx="12" cy="6" r="2.6"/><path d="M3.5 11l4 2M3.5 18l4-2M20.5 11l-4 2M20.5 18l-4-2M9.5 3.5L8 2M14.5 3.5L16 2"/>'),
 snow:sv('<path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5"/>'),
 hail:sv('<path d="M6.5 14a4.5 4.5 0 0 1 .8-8.9A6 6 0 0 1 18.8 7a3.8 3.8 0 0 1-.8 7.5z"/><circle cx="8" cy="19" r="1.2"/><circle cx="13" cy="21" r="1.2"/><circle cx="17.5" cy="18.5" r="1.2"/>'),
 puddle:sv('<path d="M12 3c3.2 4 5.5 6.6 5.5 9.6a5.5 5.5 0 0 1-11 0C6.5 9.6 8.8 7 12 3z"/><path d="M4 21c2-1.2 3.4-1.2 5 0s3 1.2 5 0 3-1.2 6 0"/>'),
 drop:sv('<path d="M12 3c3.2 4 5.5 6.6 5.5 9.6a5.5 5.5 0 0 1-11 0C6.5 9.6 8.8 7 12 3z"/>'),
 heart:sv('<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/>','stroke-width="2.4"')
};
const EV={dry:{name:'Dry spell',ic:'sun',cls:'ev-dry',word:'Thirsty'},bugs:{name:'Busy bugs',ic:'bug',cls:'ev-bugs',word:'Bug visit'},wind:{name:'Big wind',ic:'wind',cls:'ev-wind',word:'Windswept'},
 frost:{name:'Frosty night',ic:'snow',cls:'ev-frost',word:'Chilly'},heat:{name:'Hot day',ic:'hot',cls:'ev-heat',word:'Warm'},hail:{name:'Hail shower',ic:'hail',cls:'ev-hail',word:'Icy'},flood:{name:'Big puddles',ic:'puddle',cls:'ev-flood',word:'Splashed'}};
const P=n=>`../plants/plant_${n}.svg`;
function rnd(s){let x=Math.sin(s*127.1)*43758.5453;return x-Math.floor(x)}

/* ---- art pieces ---- */
const termite=(x,y,s,r)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})" stroke="#4A2F18" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
 <path d="M-6 5l-3 6M0 6v6.5M6 5l3 6M-6 -5l-3 -6M0 -6v-6.5M6 -5l3 -6" fill="none"/>
 <ellipse cx="0" cy="0" rx="13" ry="7" fill="#EBC283"/><path d="M-5 -6.5v13M3 -6.5v13" stroke="#B9854A" fill="none"/>
 <circle cx="15" cy="0" r="7" fill="#D79A55"/>
 <circle cx="17.5" cy="-3" r="2.6" fill="#fff" stroke-width="1"/><circle cx="18.2" cy="-3" r="1.2" fill="#2C1A0C" stroke="none"/>
 <circle cx="17.5" cy="3.4" r="2.6" fill="#fff" stroke-width="1"/><circle cx="18.2" cy="3.4" r="1.2" fill="#2C1A0C" stroke="none"/>
 <path d="M20 -5q4 -5 8 -4M20 5q4 5 8 4" fill="none"/></g>`;
const leafBlow=(x,y,r,s=1,trail=true)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M-14 0C-8 -10 8 -10 14 0C8 10 -8 10 -14 0Z" fill="#6DAF4A" stroke="#2E6B2E" stroke-width="1.6"/><path d="M-12 0H12" stroke="#2E6B2E" stroke-width="1.4"/>${trail?'<path d="M-20 -3h-12M-22 4h-16" stroke="var(--swoosh)" stroke-width="2.2" stroke-linecap="round"/>':''}</g>`;
const sparkle=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M0 -7v14M-6 -3.5l12 7M-6 3.5l12 -7"/></g>`;
const cloud=(x,y,s,c='#fff',o=.9)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" opacity="${o}"><ellipse cx="0" cy="0" rx="34" ry="14"/><ellipse cx="-16" cy="-8" rx="16" ry="14"/><ellipse cx="10" cy="-12" rx="20" ry="16"/></g>`;
const sunDraw=(x,y,r,fill='#FFC84A')=>{let rays='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180;rays+=`<path d="M${(x+Math.cos(a)*(r+6)).toFixed(1)} ${(y+Math.sin(a)*(r+6)).toFixed(1)}L${(x+Math.cos(a)*(r+15)).toFixed(1)} ${(y+Math.sin(a)*(r+15)).toFixed(1)}"/>`}return `<g stroke="${fill}" stroke-width="4" stroke-linecap="round">${rays}</g><circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`};
const HAILDEF=`<defs><radialGradient id="ph" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#CFE0EF"/></radialGradient></defs>`;
function pellets(n,seed){let o='';for(let i=0;i<n;i++){const x=rnd(i+seed)*350+5,y=rnd(i*3+seed+4)*190+6,r=(3.6+rnd(i+4)*2).toFixed(1);o+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r}"/><path d="M${(x-3).toFixed(0)} ${(y-r*1.9-3).toFixed(0)}l-2 -5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>`}return `<g fill="url(#ph)" stroke="#8FA6BB" stroke-width="1.2">${o}</g>`}
function rain(n,seed,dx,dy,w=2){let o='';for(let i=0;i<n;i++){const x=rnd(i+seed)*380,y=rnd(i*3+seed+9)*300;o+=`<path d="M${x.toFixed(0)} ${y.toFixed(0)}l${dx} ${dy}"/>`}return `<g stroke="var(--rain)" stroke-width="${w}" stroke-linecap="round" opacity=".7" fill="none">${o}</g>`}

/* ---- growth bar: same earned fill always; weather = soft tint + word ---- */
function bar(weathered){
 const xs=[14,80,148,216,290],y=24,labs=['Tiny','Sprout','Bud','Bloom','Full bloom'],reach=2,partial=30;
 let o='';
 if(weathered)o+=`<rect class="tint" x="0" y="10" width="330" height="28" rx="14"/>`;
 o+=`<path d="M${xs[0]} ${y}H${xs[reach]+partial}" stroke="var(--ok)" stroke-width="8" stroke-linecap="round"/><path d="M${xs[reach]+partial} ${y}H${xs[4]}" stroke="var(--line)" stroke-width="8" stroke-linecap="round" opacity="${weathered?0:1}"/>`;
 if(weathered)o+=`<path d="M${xs[reach]+partial+2} ${y}H${xs[4]}" stroke="var(--sec)" stroke-width="2" stroke-linecap="round" opacity=".55"/>`;
 let nodes='';
 xs.forEach((x,i)=>{
  nodes+=i<=reach?`<circle cx="${x}" cy="${y}" r="12" fill="var(--ok)"/><path d="M${x-5} ${y}l3.5 3.5L${x+6} ${y-4}" stroke="var(--surface)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
   :`<circle cx="${x}" cy="${y}" r="11" fill="var(--surface)" stroke="var(--sec)" stroke-width="2.2"/>`;
  if(!AX)nodes+=`<text x="${x}" y="56" text-anchor="${i==0?'start':i==4?'end':'middle'}" font-size="13" font-weight="700" fill="var(--text)" ${i==0?'transform="translate(-8 0)"':i==4?'transform="translate(40 0)"':''}>${labs[i]}</text>`;
 });
 return `<svg class="path" viewBox="-8 0 346 62" role="img" aria-label="Growth: Bud reached, Bloom next.${weathered?' Windswept today.':''}"><g aria-hidden="true">${o}${nodes}</g></svg>`}
function growth(k,weathered){
 const e=EV[EVK[k]]||EV.dry;
 const chip=weathered?`<span class="rest-chip" style="background:color-mix(in srgb,var(--ev) 30%,var(--surface))"><span style="display:grid;width:16px;height:16px">${IC[e.ic]}</span>${e.word}</span>`:`<span class="rest-chip"><span style="display:grid;width:16px;height:16px">${IC.check}</span>${k==='shrug'?'Happy':'Mended'}</span>`;
 return `<div class="card growth ${e.cls}"><div class="row"><span>Growth</span>${chip}</div>${bar(weathered)}${AX?'<p class="note">Bud reached, Bloom next.</p>':''}<p class="note">Growth keeps going. Care helps it shake off the weather.</p></div>`}
const puzzle=`<div class="card puz">${frog}<div class="tx"><b>Weather puzzle</b>Solve it for the Frog friend sticker and a word toward your next plant.</div><button class="btn secondary">Play</button></div>`;
function plantPage(k,o={}){
 const nm=NAME[k],cap=CAP[k],b=BTN[k];
 return `<div class="phone">
 <div class="status"><span>9:41</span><span>100%</span></div>
 <div class="nav"><span class="back">${IC.back}Garden</span><span class="navt">${nm}</span><span class="navr"></span></div>
 ${o.stage||LOOK[k]()}
 <div class="cap"><h2>${cap[0]}</h2><p>${cap[1]}</p></div>
 ${k==='shrug'?growth(k,false).replace('Growth keeps going. Care helps it shake off the weather.','Desert plants shrug off a dry spell.'):growth(k,true)}
 <div class="act"><button class="btn primary">${IC[b[0]]}${b[1]}</button></div>
 ${k==='shrug'?'':puzzle+'<p class="hint">Skip is free. Care will help it mend.</p>'}

function artKit(){return `<svg class="art" viewBox="0 0 361 110" preserveAspectRatio="xMidYMid slice" style="height:110px"><defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb,#9CCB7A 40%,var(--surface))"/><stop offset="1" stop-color="color-mix(in srgb,#9CCB7A 12%,var(--surface))"/></linearGradient></defs><rect width="361" height="110" fill="url(#g3)"/>${cloud(70,36,.9,'#fff',.8)}${cloud(300,50,.8,'#fff',.7)}${sunDraw(200,40,14,'#FFC04A')}

const ORDER=['shade','bug','net','frost','umbrella','bed'];

 const wind=kind==='wind',ev=wind?'ev-warn':'ev-dry',hn=wind?'wind net':'shade cloth';

  body=`<div class="card warn ev-calm">${artKit()}<div class="in"><h2>A weather kit for you, from the Shed.</h2><p class="lead">Six free helpers for your garden. Set one out the day before a weather day.</p>${helperIcons(ORDER)}<div style="height:14px"></div><button class="btn primary">Got it</button><button class="btn quiet">Open the Shed</button></div></div>`;

  <div class="card puz" style="margin:0 0 10px;box-shadow:inset 0 0 0 1.5px var(--line)">${frog}<div class="tx"><b>Weather puzzle</b>Solve it for the Frog friend sticker and a word toward your next plant.</div></div>

const HELP={shade:['Shade cloth','For Dry spell and Hot day.'],bug:['Bug cover','For Busy bugs. No sprays.'],net:['Wind net','For Big wind.'],frost:['Frost cloth','For Frosty night.'],umbrella:['Garden umbrella','For Hail shower.'],bed:['Raised bed','For Big puddles.']};
function tool(k,state){
 const [nm,us]=HELP[k];
 const ic=`<svg class="ic" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="var(--surface)" stroke="var(--ring)" stroke-width="2.6"/>${TI[k]}</svg>`;
 let go;
 if(state==='set')go=`<div class="go"><button class="btn set">${IC.check.replace('<svg','<svg style="width:18px;height:18px"')}Out</button></div>`;
 else if(state==='ready-btn')go=`<div class="go"><button class="btn secondary" style="background:var(--accent);color:var(--ink);box-shadow:none">Set out</button></div>`;
 else go=`<div class="go ready">${IC.check}Ready</div>`;
 return `<div class="card tool">${ic}<div class="tx"><div class="nm">${nm}</div><div class="us">${us}</div></div>${go}</div>`}
function shed(out){
 return `<div class="phone"><div class="status"><span>9:41</span><span>100%</span></div>
 <div class="nav"><span class="back">${IC.back}Home</span><span class="navt">Garden Shed</span><span class="navr"></span></div>
 <div class="shed-h"><h2>Weather helpers</h2><p>A weather kit for you, from the Shed. Set out the helper for tomorrow's weather.</p></div>
 <div class="pill" style="--ev:#7FA0BD;margin:0 16px 10px;align-self:flex-start"><span style="display:grid">${IC.wind}</span>Tomorrow: Big wind</div>
 ${ORDER.map(k=>tool(k,k==='net'?(out?'set':'ready-btn'):'ready')).join('')}
 </div>`}

/* ---- Snug garden frame (big wind, net over the whole garden) ---- */
function snug(){
 const xs=[62,180,298],names=['sunflower','rose','daisy'];
 let beads='';for(let i=0;i<30;i++){const x=24+rnd(i+11)*314,y=60+rnd(i*5+2)*170;beads+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(2.2+rnd(i)*1.6).toFixed(1)}"/>`}
 const pots=xs.map(c=>`<g transform="translate(${c} 0)"><path d="M-48 242L48 242L42 282Q41 286 37 286L-37 286Q-41 286 -42 282Z" fill="var(--pot)"/><rect x="-53" y="232" width="106" height="14" rx="6" fill="var(--pot-rim)"/></g>`).join('');
 const soils=xs.map(c=>`<ellipse cx="${c}" cy="232" rx="52" ry="9" fill="var(--soil)"/>`).join('');
 const strands=Array.from({length:12},(_,i)=>`<path d="M${-30+i*44} 10L${-30+i*44-90} 290M${-30+i*44} 10L${-30+i*44+90} 290"/>`).join('');
 const dome='M8 292C8 76 76 26 180 26S352 76 352 292Z';
 return `<div class="stage ev-wind"><div class="sky"></div>
 <svg class="lay" viewBox="0 0 361 310">${cloud(60,34,.9,'#fff',.85)}${cloud(300,40,.8,'#fff',.7)}<g fill="none" stroke="var(--swoosh)" stroke-width="3" stroke-linecap="round" opacity=".9"><path d="M2 20C30 12 50 28 80 20"/><path d="M290 120C320 112 340 126 358 118"/></g>${rain(10,9,-8,20,1.6)}${leafBlow(332,78,-15,.6,!RM)}</svg>
 <svg class="lay" viewBox="0 0 361 310">${soils}</svg>
 ${xs.map((c,i)=>`<img src="${P(names[i])}" alt="" style="position:absolute;left:${c-62}px;top:116px;width:124px;height:124px">`).join('')}
 <svg class="lay" viewBox="0 0 361 310"><rect x="0" y="292" width="361" height="18" fill="var(--shelf)"/>${pots}</svg>
 <svg class="lay" viewBox="0 0 361 310"><defs><clipPath id="dm"><path d="${dome}"/></clipPath></defs>
  <path d="${dome}" fill="#fff" fill-opacity=".12"/>
  <g clip-path="url(#dm)" stroke="var(--net)" stroke-width="2.6" opacity=".38">${strands}</g>
  <path d="${dome}" fill="none" stroke="var(--net)" stroke-width="3.4" stroke-linecap="round"/>
  <g fill="#fff" fill-opacity=".85" stroke="var(--rain)" stroke-width="1.2" clip-path="url(#dm)">${beads}</g></svg>
 <span class="pill" style="--ev:#7FA0BD"><span style="display:grid">${IC.wind}</span>Big wind: net is out</span></div>`}
function snugPage(){
 return `<div class="phone"><div class="status"><span>9:41</span><span>100%</span></div>
 <div class="nav"><span class="back">${IC.back}Home</span><span class="navt">My Garden</span><span class="navr"></span></div>
 ${snug()}
 <div class="cap"><h2>Your garden is snug.</h2><p>The wind net is out for your whole garden. The plants stay tall and happy.</p></div>
 <div class="card growth ev-wind" style="margin-top:12px"><div class="row"><span>Garden</span><span class="rest-chip"><span style="display:grid;width:16px;height:16px">${IC.check}</span>Sheltered</span></div><p class="note" style="margin-top:6px">Sheltered plants need no mending. A hello is always a nice thing to do.</p></div>
 ${puzzle}<p class="hint">Skip is free.</p></div>`}

/* ---- growth bar explainer ---- */
function barScreen(){
 const blk=(t,chip,w,txt)=>`<div class="card barc ev-wind"><div class="row" style="display:flex;justify-content:space-between;align-items:center"><h3>${t}</h3>${chip}</div>${bar(w)}<p style="margin:0;font-size:14px;line-height:1.35;color:var(--sec);text-align:center">${txt}</p></div>`;
 const wchip=`<span class="rest-chip" style="background:color-mix(in srgb,var(--ev) 30%,var(--surface))"><span style="display:grid;width:16px;height:16px">${IC.wind}</span>Windswept</span>`;
 const mchip=`<span class="rest-chip"><span style="display:grid;width:16px;height:16px">${IC.check}</span>Mended</span>`;
 return `<div class="phone"><div class="status"><span>9:41</span><span>100%</span></div>
 <div class="nav"><span class="back">${IC.back}Garden</span><span class="navt">Growth</span><span class="navr"></span></div>
 <div class="cap" style="padding-top:6px"><p style="margin:0">Growth keeps going on every kind of day. Care helps a plant shake off the weather.</p></div>
 ${blk('Sunny day','',false,'The green is what you have grown.')}
 ${blk('Weathered','' ,true,'The same green. A soft tint and the word Windswept show the weather.').replace('<h3>Weathered</h3>','<h3>Weathered</h3>'+wchip).replace('<h3>Weathered</h3>'+wchip,'<h3>Weathered</h3>'+wchip)}
 ${blk('Mended',mchip,false,'One drink or hello, and the tint is gone. The green never changed.')}
 <div class="dn"><b>Design note, not in app.</b> Earned fill is identical in all three. Two states: weathered (tint, weather word, tinted plant art) and mended. The tint has help: the pill carries a word and an icon. Stage names are Tiny, Sprout, Bud, Bloom, Full bloom.</div>
 </div>`}
