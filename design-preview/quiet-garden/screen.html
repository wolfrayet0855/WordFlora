<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiet Garden offer</title>
<!--
  The "Would you like a quiet garden?" screen, shown after an under-13 player picks "Under 13" on the age question.
  It replaces the plain system dialog. Full screen (the age question leaves while it shows).
  Params: theme=light|dark  scale=1|1.65|2.1 (Dynamic Type: ~AX1 / ~AX3)  rm=1 (Reduce Motion: no breathing)  tall=1 (grow to fit)
  Palette and type match design-preview/rest-card/card.html (the app's colour assets).
-->
<style>
:root,[data-theme=light]{
  --bg:#FAF7F0;--surface:#FFFFFF;--text:#2C3E2C;--accent:#E8A838;--ink:#1F3320;--ok:#2E7D32;
  --sec:color-mix(in srgb,var(--text) 88%,transparent);--line:color-mix(in srgb,var(--text) 12%,transparent);
  --visit:#ECE5F6;--bloom:#FDE9EE;--levels:#DFEDF8;--garden:#E3F1DD;--visit-ink:#6A4A9C;--levels-ink:#1F5F8F;--hill:#CFE6C4}
[data-theme=dark]{
  --bg:#1A2E1A;--surface:#2C3E2C;--text:#D4EDD4;--accent:#F0C060;--ink:#1A2E1A;--ok:#81C784;
  --visit:#40395A;--bloom:#4D3039;--levels:#2A4358;--garden:#2F4F30;--visit-ink:#CDB8F2;--levels-ink:#8CC4EC;--hill:#2F4F30}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--scale,1))}
body{margin:0;background:#888;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text)}
.phone{width:393px;height:852px;position:relative;overflow:hidden;background:var(--bg)}
.tall .phone{height:auto;min-height:852px}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font:600 15px system-ui}
.page{display:flex;flex-direction:column;gap:24px;padding:0 16px 24px}
.back{align-self:flex-start;min-height:44px;min-width:44px;display:flex;align-items:center;gap:4px;font-size:1.0625rem;font-weight:600;color:var(--text);background:none;border:0;padding:0;font-family:inherit;margin-bottom:-16px}
.back svg{width:1.1rem;height:1.1rem}

/* the scene: a calm evening garden. Fixed height, it never grows with text. */
.scene{position:relative;height:184px;border-radius:24px;overflow:hidden;flex:none;
  background:linear-gradient(180deg,var(--levels) 0%,var(--visit) 50%,var(--bloom) 82%,color-mix(in srgb,var(--bloom) 50%,var(--bg)) 100%)}
.sun{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--accent);right:40px;top:22px}
.hill{position:absolute;left:-10%;right:-10%;bottom:-70px;height:120px;border-radius:50%;background:var(--hill)}
.plants{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:flex-end}
.plants img{width:96px;margin:0 -10px;transform-origin:bottom center;animation:breathe 4.8s ease-in-out infinite}
.plants img.mid{width:116px;z-index:1;animation-delay:-1.6s}
.plants img:last-child{animation-delay:-3.2s}
.fly{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 2px color-mix(in srgb,var(--accent) 60%,transparent);animation:glow 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025) translateY(-1px)}}
@keyframes glow{50%{opacity:.35}}
.rm .plants img,.rm .fly,.static .plants img,.static .fly{animation:none}

h1{font-size:1.75rem;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.01em;text-align:center;text-wrap:balance}
.rows{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);margin-top:-8px}
.row{display:flex;align-items:center;gap:12px;font-size:1.0625rem;line-height:1.3;font-weight:600}
.row .ic{width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;flex:none}
.row .ic svg{width:1.15rem;height:1.15rem}
.row.a .ic{background:var(--garden);color:var(--ok)}
.row.b .ic{background:var(--levels);color:var(--levels-ink)}
.row.c .ic{background:var(--bloom);color:#C2185B}
[data-theme=dark] .row.c .ic{color:#F8BBD0}
.row .t{flex:1;min-width:0}
.btns{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:12px 16px;border-radius:18px;border:0;font-family:inherit;font-size:1.1875rem;font-weight:800;line-height:1.2;text-align:center;cursor:pointer}
.btn.yes{background:var(--accent);color:var(--ink)}
.btn.no{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--text) 22%,transparent)}
.note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.9375rem;line-height:1.3;color:var(--sec);text-align:center;margin-top:-12px}
.note svg{width:1rem;height:1rem;flex:none}
.ax .row{align-items:flex-start}
</style></head>
<body>
<div class="phone" id="phone">
  <div class="status"><span>9:41</span><span>●●● ▮</span></div>
  <div class="page">
    <button class="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
    <div class="scene" aria-hidden="true">
      <div class="sun"></div>
      <span class="fly" style="left:58px;top:40px"></span>
      <span class="fly" style="left:120px;top:78px;animation-delay:-1.2s"></span>
      <span class="fly" style="left:236px;top:64px;animation-delay:-2.3s"></span>
      <div class="hill"></div>
      <div class="plants">
        <img src="../plants/plant_daisy.svg" alt=""><img class="mid" src="../plants/plant_lavender.svg" alt=""><img src="../plants/plant_clover.svg" alt="">
      </div>
    </div>
    <h1>Would you like a quiet garden?</h1>
    <div class="rows">
      <div class="row a"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4c-9 0-15 4-15 11 0 1.4.3 2.6.9 3.7C4.6 20 4 21 4 21l1.4 1s.8-1.4 2.2-2.6c1.1.6 2.4 1 3.8 1C18 20.4 20 13 20 4z"/></svg></span><span class="t">No points or counting. Just tending.</span></div>
      <div class="row b"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5S5.5 9.6 5.5 14.3a6.5 6.5 0 0013 0C18.5 9.6 12 2.5 12 2.5z"/></svg></span><span class="t">Water and tools are always ready.</span></div>
      <div class="row c"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg></span><span class="t">You still guess words and grow plants.</span></div>
    </div>
    <div class="btns">
      <button class="btn yes">Yes, keep it quiet</button>
      <button class="btn no">No thanks, show everything</button>
    </div>
    <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>You can change this any time in Settings.</div>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search);
document.documentElement.dataset.theme=q.get('theme')||'light';
const s=parseFloat(q.get('scale')||'1');document.documentElement.style.setProperty('--scale',s);
if(s>1.3)document.body.classList.add('ax');
if(q.get('rm'))document.body.classList.add('rm');
if(q.get('static'))document.body.classList.add('static');
if(q.get('tall'))document.body.classList.add('tall');
</script>
</body></html>
